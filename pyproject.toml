[project]
name = "visaodoagro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cristian de Biasi", email = "cristian.biasi20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "pytest>=9.1.1",
    "ultralytics>=8.4.152",
    "uvicorn>=0.53.0",
]

[project.scripts]
visaodoagro = "visaodoagro:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
