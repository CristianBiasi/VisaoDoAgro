[project]
name = "visaodoagro-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cristian de Biasi", email = "cristian.biasi20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    "av>=17.1.0",
    "fastapi>=0.141.1",
    "lap>=0.5.13",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "sqlalchemy>=2.0.54",
    "ultralytics>=8.4.157",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
visaodoagro-main = "visaodoagro_main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
